[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlimiter"
version = "0.1.0"
description = "Windows background app that limits how long you play games."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "pywin32>=306",
    "windows-toasts>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
playlimiter = "playlimiter.cli:main"

[tool.setuptools]
packages = ["playlimiter"]

[tool.setuptools.package-data]
playlimiter = ["config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
